<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xpert CRM — Sales workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --surface-2:#EEF0F5; --line:#E1E4EC; --line-2:#CDD2DE;
  --text:#161A2A; --muted:#5F6680; --faint:#8E94A8;
  --ink:#1C1F5C; --ink-2:#2A2E78; --ink-text:#C3C5E8; --ink-hi:#FFFFFF;
  --mag:#2D3192; --mag-hover:#23266F; --mag-soft:#E9EAF7; --orange:#F4931E; --orange-soft:#FEF0DC;
  --cyan:#008FCC; --cyan-soft:#E1F2FA;
  --yel:#D07A08; --yel-soft:#FEF0DC;
  --green:#15875A; --green-soft:#DFF3EA;
  --red:#C73737; --red-soft:#FBE6E6;
  --bar:#CBD0DF;
  --shadow:0 1px 2px rgba(22,26,42,.05),0 6px 20px rgba(22,26,42,.05);
  --shadow-lg:0 12px 48px rgba(22,26,42,.22);
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --display:'Bricolage Grotesque','Figtree',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10131C; --surface:#181C28; --surface-2:#1F2433; --line:#2A3043; --line-2:#394058;
    --text:#E8EAF2; --muted:#A0A6BC; --faint:#737A92;
    --ink:#0E1030; --ink-2:#1C1F52; --ink-text:#A4A7D0;
    --mag:#8C90F2; --mag-hover:#A5A8F6; --mag-soft:#24264A; --orange:#F6A443; --orange-soft:#3A2A12;
    --cyan:#35B3EA; --cyan-soft:#132E3C; --yel:#F0B429; --yel-soft:#3A2F12;
    --green:#3CC08A; --green-soft:#12332A; --red:#EE6464; --red-soft:#3A1818;
    --bar:#394058; --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 48px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10131C; --surface:#181C28; --surface-2:#1F2433; --line:#2A3043; --line-2:#394058;
  --text:#E8EAF2; --muted:#A0A6BC; --faint:#737A92;
  --ink:#0E1030; --ink-2:#1C1F52; --ink-text:#A4A7D0;
  --mag:#8C90F2; --mag-hover:#A5A8F6; --mag-soft:#24264A; --orange:#F6A443; --orange-soft:#3A2A12;
  --cyan:#35B3EA; --cyan-soft:#132E3C; --yel:#F0B429; --yel-soft:#3A2F12;
  --green:#3CC08A; --green-soft:#12332A; --red:#EE6464; --red-soft:#3A1818;
  --bar:#394058; --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 48px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.2;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.side{background:var(--ink);color:var(--ink-text);display:flex;flex-direction:column;padding:18px 12px;gap:6px;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:8px;padding:2px 4px 16px;color:var(--ink-hi)}
.brand-tile{background:#fff;border-radius:10px;padding:10px 12px;display:flex;justify-content:center}
.brand-tile img{width:100%;max-width:190px;height:auto;display:block}
.brand small{padding-left:4px;color:var(--ink-text);font-size:12px}
.brand svg{flex:none}
.brand b{display:block;font-family:var(--display);font-size:16px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.brand small{display:block;font-size:12px;color:var(--ink-text)}
.nav a{cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--ink-text);text-decoration:none;font-weight:500;font-size:14.5px;position:relative}
.nav a:hover{background:var(--ink-2);color:var(--ink-hi)}
.nav a.on{background:var(--ink-2);color:var(--ink-hi)}
.nav a.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--orange)}
.nav .sep{height:1px;background:rgba(255,255,255,.08);margin:10px 8px}
.nav .badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--orange);color:#fff;border-radius:999px;padding:1px 7px}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px 0;border-top:1px solid rgba(255,255,255,.08)}
.side-foot b{display:block;color:var(--ink-hi);font-size:13.5px;font-weight:600}
.side-foot small{font-size:12px}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:20}
.search{position:relative;flex:1;max-width:520px}
.search input{width:100%;height:38px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:0 12px 0 36px}
.search input:focus{background:var(--surface);border-color:var(--line-2);outline:none;box-shadow:0 0 0 3px var(--cyan-soft)}
.search #sIcon{position:absolute;left:11px;top:10px;color:var(--faint);display:flex;pointer-events:none}
[hidden]{display:none !important}
.sresults{position:absolute;top:44px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);max-height:420px;overflow:auto;display:none;padding:6px}
.sresults.show{display:block}
.sresults h5{margin:8px 10px 4px;font-size:12px;color:var(--faint);font-weight:600}
.sresults button{display:flex;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;justify-content:space-between;gap:10px}
.sresults button:hover{background:var(--surface-2)}
.sresults button span{color:var(--muted);font-size:13px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.ai-pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);cursor:pointer}
.ai-pill i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.ai-pill.on i{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.ai-pill.demo i{background:var(--yel)}
#view{flex:1;overflow:auto;padding:24px 28px 48px}
.scrim{display:none}

/* ---------- common ---------- */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-h h1{font-size:28px;font-weight:700}
.page-h p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--mag);border-color:var(--mag);color:#fff}
.btn.primary:hover{background:var(--mag-hover)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:7px}
.btn.ai{background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(120deg,var(--orange),var(--mag)) border-box;border:1.5px solid transparent}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 0}
.card-h h3{font-size:16px;font-weight:600}
.card-b{padding:14px 18px 18px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-cyan{background:var(--cyan-soft);color:var(--cyan)} .p-mag{background:var(--mag-soft);color:var(--mag)}
.p-yel{background:var(--yel-soft);color:var(--yel)} .p-green{background:var(--green-soft);color:var(--green)}
.p-red{background:var(--red-soft);color:var(--red)} .p-grey{background:var(--surface-2);color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);font-weight:500}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;flex:none;letter-spacing:.02em}
.av.lg{width:44px;height:44px;font-size:15px}
.grid{display:grid;gap:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13.5px;font-weight:500;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
:root[data-theme="dark"] .chip.on{background:var(--text);color:var(--bg)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{height:38px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 11px;width:100%;min-width:0}
textarea.input{height:auto;padding:10px 11px;resize:vertical;line-height:1.5}
.input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-soft)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl .r{text-align:right}
.cell-client{display:flex;align-items:center;gap:10px}
.cell-client b{display:block;font-weight:600}
.cell-client small{color:var(--muted)}
.logo-sq{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;flex:none}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.toasts{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:14px;max-width:360px;animation:tin .2s ease-out}
.toast.err{background:var(--red)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* ---------- modal / drawer ---------- */
.overlay{position:fixed;inset:0;background:rgba(12,15,28,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:calc(100% - 20px);display:flex;flex-direction:column;animation:min .18s ease-out}
.modal.wide{max-width:760px}
@keyframes min{from{transform:scale(.98);opacity:0}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:18px}
.modal-b{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.drawer-ov{position:fixed;inset:0;background:rgba(12,15,28,.4);z-index:90}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:91;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:din .22s ease-out;padding-top:env(safe-area-inset-top,0px)}
@keyframes din{from{transform:translateX(30px);opacity:0}}
.drawer-h{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.drawer-b{overflow:auto;padding:18px 22px 40px;display:flex;flex-direction:column;gap:20px}
.drawer h4{font-size:14px;font-weight:600;margin-bottom:8px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.kv small{display:block;color:var(--muted);font-size:12px}
.kv b{font-family:var(--display);font-size:17px}
.contact-line{display:flex;gap:8px;flex-wrap:wrap}
.list-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.list-line:last-child{border-bottom:0}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi small{color:var(--muted);font-size:13px;font-weight:500}
.kpi .big{font-family:var(--display);font-size:28px;font-weight:700;margin:6px 0 4px;letter-spacing:-.02em}
.kpi .sub{font-size:13px;color:var(--muted)}
.kpi .sub b.up{color:var(--green)} .kpi .sub b.down{color:var(--red)}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.kpi.c::after{background:var(--cyan)} .kpi.m::after{background:var(--orange)} .kpi.y::after{background:var(--mag)} .kpi.k::after{background:var(--text)}
.meter{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;border-radius:6px;background:var(--orange)}
.dash-a{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.dash-b{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.funnel-row{display:grid;grid-template-columns:130px 1fr 80px;gap:10px;align-items:center;margin:9px 0;font-size:13.5px}
.funnel-row .tr{height:22px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.funnel-row .tr i{display:block;height:100%;border-radius:5px}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.task:last-child{border-bottom:0}
.task input{margin-top:3px;accent-color:var(--mag);width:16px;height:16px;flex:none}
.task.done span{text-decoration:line-through;color:var(--faint)}
.task small{display:block;color:var(--muted);font-size:12.5px}
.act{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.act:last-child{border-bottom:0}
.act .dot{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.act small{display:block;color:var(--faint);font-size:12px}
.hot{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.hot:last-child{border-bottom:0}
.hot .t{flex:1;min-width:0}
.hot .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hot .t small{color:var(--muted);font-size:12.5px}
.hot .v{text-align:right;font-size:13px}
.hot .v b{display:block;font-family:var(--display);font-size:15px}
.brief{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;background:var(--surface);display:flex;gap:16px;align-items:flex-start;position:relative;overflow:hidden}
.brief::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(var(--orange),var(--mag))}
.brief .bt{flex:1;min-width:0}
.brief h3{font-size:17px;margin-bottom:4px}
.md p{margin:0 0 8px} .md ul{margin:4px 0 10px;padding-left:20px} .md li{margin:3px 0} .md h4{font-size:14.5px;margin:10px 0 4px}

/* ---------- pipeline ---------- */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;min-height:60vh}
.col{flex:0 0 252px;background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:300px;border:1px solid transparent}
.col.over{border-color:var(--cyan);background:var(--cyan-soft)}
.col-h{padding:4px 6px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.col-h b{font-size:14px;display:flex;align-items:center;gap:7px}
.col-h b i{width:9px;height:9px;border-radius:3px}
.col-h span{font-size:12.5px;color:var(--muted)}
.col-total{font-family:var(--display);font-size:15px;font-weight:600;padding:0 6px 4px}
.deal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.deal:hover{border-color:var(--line-2)}
.deal.drag{opacity:.4}
.deal b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.deal .cl{font-size:13px;color:var(--muted);margin:2px 0 8px}
.deal .ft{display:flex;align-items:center;justify-content:space-between;gap:8px}
.deal .val{font-family:var(--display);font-weight:600;font-size:15px}
.deal .due{font-size:12px;color:var(--muted)}
.deal .due.warn{color:var(--red);font-weight:600}
.deal .av{width:24px;height:24px;font-size:10px}

/* ---------- sales ---------- */
.sales-a{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.rep{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rep:last-child{border-bottom:0}
.rep .meter{height:8px}
.rep .nm{display:flex;justify-content:space-between;font-size:14px;gap:10px}
.rep .nm span{color:var(--muted);font-size:13px}
.rank{font-family:var(--display);font-weight:700;font-size:18px;color:var(--faint);width:22px;text-align:center}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut-leg{flex:1;min-width:180px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.donut-leg div{display:flex;justify-content:space-between;gap:10px}
.donut-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}

/* ---------- A4 / print ---------- */
.press{position:relative;margin:34px auto;width:max-content}
.press .cm{position:absolute;width:22px;height:22px;pointer-events:none}
.press .cm::before,.press .cm::after{content:"";position:absolute;background:var(--faint)}
.press .cm::before{width:18px;height:1px} .press .cm::after{width:1px;height:18px}
.press .tl{left:-26px;top:-26px} .press .tl::before{left:0;bottom:4px} .press .tl::after{right:4px;top:0}
.press .tr{right:-26px;top:-26px} .press .tr::before{right:0;bottom:4px} .press .tr::after{left:4px;top:0}
.press .bl{left:-26px;bottom:-26px} .press .bl::before{left:0;top:4px} .press .bl::after{right:4px;bottom:0}
.press .br{right:-26px;bottom:-26px} .press .br::before{right:0;top:4px} .press .br::after{left:4px;bottom:0}
.press .reg{position:absolute;left:50%;top:-30px;transform:translateX(-50%);color:var(--faint)}
.press .pg-tools{position:absolute;right:-4px;top:-30px;display:flex;gap:4px}
.press .pg-no{position:absolute;left:0;top:-26px;font-size:12px;color:var(--faint)}
.a4{width:794px;height:1123px;background:#fff;color:#1d1d24;position:relative;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.08),0 12px 40px rgba(20,24,40,.12);font-family:var(--font);color-scheme:light}
.a4 .lh-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none}
.a4 .body{position:absolute;left:72px;right:72px;top:var(--mt,170px);bottom:var(--mb,100px);overflow:hidden;font-size:14.5px;line-height:1.65;outline:none;word-wrap:break-word}
.a4 .body[contenteditable="true"]:empty::before{content:attr(data-ph);color:#9aa0b0}
.a4 .body h1{font-family:var(--display);font-size:24px;margin:0 0 10px;color:#1d1d24}
.a4 .body h2{font-family:var(--display);font-size:19px;margin:14px 0 8px;color:#1d1d24}
.a4 .body h3{font-family:var(--display);font-size:16px;margin:12px 0 6px;color:#1d1d24}
.a4 .body p{margin:0 0 10px}
.a4 .body ul,.a4 .body ol{margin:0 0 10px;padding-left:22px}
.a4 .body table{border-collapse:collapse;width:100%;margin:8px 0 12px;font-size:13.5px}
.a4 .body td,.a4 .body th{border:1px solid #cfd3dc;padding:6px 8px;vertical-align:top;min-width:30px}
.a4 .body hr{border:0;border-top:1px solid #cfd3dc;margin:14px 0}
.a4.show-guides .body{outline:1px dashed rgba(0,143,204,.45);outline-offset:6px}
.blh-top{position:absolute;left:0;right:0;top:0;height:150px;display:flex;flex-direction:column;align-items:center;padding-top:26px}
.blh-top img{height:78px;width:auto}
.blh-name{font-family:Georgia,'Times New Roman',serif;font-size:25px;color:#2D3192;letter-spacing:.05em;margin-top:6px;line-height:1}
.blh-foot{position:absolute;left:0;right:0;bottom:0;height:64px}
.brand-bar{display:flex;height:5px}.brand-bar i:nth-child(1){flex:2;background:#F4931E}.brand-bar i:nth-child(2){flex:3;background:#2D3192}
.blh-foot-text{padding:10px 48px 0;font-size:9.5px;line-height:1.55;color:#555a75;text-align:center}
.blh-foot-text b{color:#2D3192}
/* documents */
.inv{font-size:12.5px;line-height:1.5}
.doc-title{text-align:center;margin:0 0 14px}
.doc-title h1{font-family:var(--display);font-size:20px !important;letter-spacing:.08em;margin:0 !important;color:#2D3192 !important;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1.5px;text-decoration-color:#F4931E}
.doc-box{display:grid;grid-template-columns:1.1fr 1fr;border:1.3px solid #1d1d24;margin-bottom:14px}
.doc-box>div{padding:10px 12px;min-height:84px}
.doc-box>div+div{border-left:1.3px solid #1d1d24}
.doc-box small{display:block;font-size:10px;color:#6a7088;font-weight:700;margin-bottom:3px;letter-spacing:.02em}
.doc-box b.p{font-size:13.5px;display:block;margin-bottom:2px}
.meta-g{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}
.meta-g span{color:#555a75}
.a4 .body table.items{font-size:12px;margin:0 0 10px}
.a4 .body table.items th{background:#2D3192;color:#fff;border-color:#2D3192;font-weight:600;text-align:left;padding:7px 8px}
.a4 .body table.items td{border:1px solid #cfd3dc;padding:6px 8px}
.a4 .body table.items .r{text-align:right}
.a4 .body table.items .c{text-align:center}
.a4 .body table.items td small{color:#6a7088;display:block;font-size:11px}
.inv-tot{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.inv-words{flex:1;font-size:11.5px;color:#555b70;padding-top:6px}
.inv-sum{width:250px;font-size:12.5px}
.inv-sum div{display:flex;justify-content:space-between;padding:4px 8px}
.inv-sum .grand{background:#2D3192;color:#fff;margin-top:4px;padding:7px 8px;font-weight:700;font-size:14px}
.inv-foot{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;margin-top:20px;font-size:11.5px;color:#333849}
.inv-foot h5{font-size:11.5px;margin:0 0 4px;color:#2D3192;text-decoration:underline}
.inv-foot ul{margin:0;padding-left:16px}.inv-foot li{margin:2px 0;font-weight:600}
.sign-box{border-top:1px solid #1d1d24;padding-top:4px;text-align:center;font-size:11px;margin-top:46px}
.thanks{text-align:center;font-style:italic;color:#2D3192;margin-top:18px;font-size:12.5px}
.sysgen{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:9.5px;color:#8a8fa3}
.stamp{position:absolute;right:70px;top:40%;transform:rotate(-14deg);border:3px solid #15875A;color:#15875A;font-family:var(--display);font-weight:700;font-size:40px;padding:4px 18px;border-radius:8px;opacity:.75;letter-spacing:.06em}

/* ---------- invoice editor ---------- */
.ed{display:grid;grid-template-columns:minmax(360px,460px) minmax(0,1fr);gap:20px;align-items:start}
.ed-form{display:flex;flex-direction:column;gap:14px}
.ed-form .card-b{display:flex;flex-direction:column;gap:12px}
.li-head{display:grid;grid-template-columns:var(--licols,1fr 84px 84px 30px);gap:6px;font-size:12px;font-weight:600;color:var(--muted);padding-bottom:2px}
.li-row{display:grid;grid-template-columns:var(--licols,1fr 84px 84px 30px);gap:6px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line)}
.li-row .input{height:34px;font-size:13.5px;padding:0 8px}
.li-row .full{grid-column:1/-2}
.ed-prev{background:var(--surface-2);border-radius:12px;padding:8px;overflow:auto;position:sticky;top:0}
.ed-tot{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.ed-tot.g{font-weight:700;font-size:16px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.switch{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.switch input{accent-color:var(--mag);width:17px;height:17px}

/* ---------- letter studio ---------- */
.ls{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start;height:100%}
.ls-side{display:flex;flex-direction:column;gap:14px}
.ls-docs button.doc{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:1px solid transparent;background:none;border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left}
.ls-docs button.doc:hover{background:var(--surface-2)}
.ls-docs button.doc.on{background:var(--mag-soft);border-color:transparent}
.ls-docs button.doc b{font-size:14px;font-weight:600}
.ls-docs button.doc small{color:var(--muted);font-size:12px}
.lh-thumb{border:1px solid var(--line);border-radius:8px;aspect-ratio:210/297;width:92px;overflow:hidden;background:#fff;position:relative;flex:none}
.lh-thumb img{width:100%;height:100%;object-fit:fill}
.lh-thumb .mini{transform:scale(.1159);transform-origin:0 0;width:794px;height:1123px;position:absolute}
.range{display:flex;flex-direction:column;gap:2px;font-size:13px}
.range input{accent-color:var(--mag)}
.ls-main{min-width:0;display:flex;flex-direction:column;gap:0}
.tb{position:sticky;top:-24px;z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px;display:flex;flex-wrap:wrap;gap:2px;align-items:center;box-shadow:var(--shadow)}
.tb .g{display:flex;gap:1px;align-items:center;padding-right:6px;margin-right:4px;border-right:1px solid var(--line)}
.tb .g:last-child{border-right:0}
.tb button.t{width:32px;height:32px;border:0;background:none;border-radius:6px;cursor:pointer;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--text)}
.tb button.t:hover{background:var(--surface-2)}
.tb select{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 6px;font-size:13px}
.tb input[type=color]{width:32px;height:28px;border:0;padding:0;background:none;cursor:pointer}
.pages{overflow:auto;padding:10px 0 40px}
.fitwrap{width:max-content;margin:0 auto}

/* ---------- AI intel ---------- */
.intel{display:grid;grid-template-columns:minmax(320px,420px) minmax(0,1fr);gap:20px;align-items:start}
.intel-in .card-b{display:flex;flex-direction:column;gap:12px}
.hero-pitch{padding:22px 24px;border-radius:14px;background:var(--ink);color:#fff;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;margin-bottom:16px;position:relative;overflow:hidden}
.hero-pitch small{color:var(--ink-text);font-size:13px}
.hero-pitch h2{font-size:24px;line-height:1.25;margin:6px 0 10px;font-weight:600;color:#fff}
.hero-pitch p{margin:0;color:#d5d9ea;font-size:14.5px}
.dial{position:relative;width:118px;height:118px;flex:none}
.dial svg{transform:rotate(-90deg)}
.dial div{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.dial b{font-family:var(--display);font-size:30px;display:block;line-height:1}
.dial span{display:block;font-size:10.5px;color:var(--ink-text);max-width:62px;margin:3px auto 0;line-height:1.2}
.ib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.ib ul{margin:0;padding-left:18px} .ib li{margin:0 0 7px;font-size:14.5px}
.ib .full{grid-column:1/-1}
.opp{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.opp:last-child{border-bottom:0}
.opp b{font-size:14.5px} .opp p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.opp .v{font-family:var(--display);font-weight:600;white-space:nowrap}
.obj{padding:10px 0;border-bottom:1px solid var(--line)}
.obj:last-child{border-bottom:0}
.obj b{display:block;font-size:14px;margin-bottom:3px}
.obj p{margin:0;font-size:14px;color:var(--muted)}
.steps{list-style:none;padding:0 !important;margin:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;margin-bottom:10px !important}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--orange-soft);color:var(--yel);display:grid;place-items:center;font-weight:700;font-size:12.5px}
.steps small{display:block;color:var(--muted);font-size:12.5px}
.msg-box{background:var(--surface-2);border-radius:10px;padding:14px 16px;font-size:14px;white-space:pre-wrap;line-height:1.55}
.thinking{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:70px 20px;text-align:center;color:var(--muted)}
.ink-dots{display:flex;gap:8px}
.ink-dots i{width:12px;height:12px;border-radius:50%;animation:bob 1.1s ease-in-out infinite}
.ink-dots i:nth-child(1){background:#F4931E}.ink-dots i:nth-child(2){background:#2D3192;animation-delay:.12s}.ink-dots i:nth-child(3){background:#F4931E;animation-delay:.24s}.ink-dots i:nth-child(4){background:#2D3192;animation-delay:.36s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.intel-empty{border:1.5px dashed var(--line-2);border-radius:14px;padding:48px 28px;text-align:center;color:var(--muted)}
.intel-empty h3{color:var(--text);font-size:19px;margin-bottom:8px}
.saved-briefs button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;text-align:left;gap:8px}
.saved-briefs button:hover{color:var(--mag)}
.demo-note{font-size:12.5px;background:var(--yel-soft);color:var(--text);border-radius:8px;padding:8px 10px}

/* ---------- menus ---------- */
.menu{position:absolute;top:44px;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;min-width:200px;display:none;z-index:50}
.menu.show{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:14px;text-align:left}
.menu button:hover{background:var(--surface-2)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dash-b{grid-template-columns:1fr 1fr}
  .ed,.intel{grid-template-columns:1fr}
  .ed-prev{position:static}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:80;transform:translateX(-100%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70}
  .dash-a,.dash-b,.sales-a,.ib{grid-template-columns:1fr}
  .ls{grid-template-columns:1fr}
  .ls-main{order:-1}
  #view{padding:18px 16px 40px}
  .top{padding:10px 14px}
  .hide-m{display:none !important}
  .f3{grid-template-columns:1fr 1fr}
  .tb{top:-18px}
}
@media (min-width:901px){.only-m{display:none !important}}
@media (max-width:560px){
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi .big{font-size:22px}
  .f2,.f3{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr 1fr}
  .hero-pitch{grid-template-columns:1fr}
  .page-h h1{font-size:23px}
  .ai-pill span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand" id="brand"></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top">
      <button class="icon-btn only-m" id="menuBtn" aria-label="Open menu"></button>
      <div class="search">
        <span id="sIcon"></span>
        <input id="gsearch" type="search" placeholder="Search clients, deals, invoices" autocomplete="off" aria-label="Search">
        <div class="sresults" id="sresults"></div>
      </div>
      <div class="top-right">
        <button class="ai-pill" id="aiPill" title="AI status"><i></i><span>Connecting AI</span></button>
        <div style="position:relative">
          <button class="btn primary" id="newBtn"></button>
          <div class="menu" id="newMenu"></div>
        </div>
      </div>
    </header>
    <section id="view" tabindex="-1"></section>
  </div>
</div>
<div id="modalRoot"></div>
<div id="drawerRoot"></div>
<div class="toasts" id="toasts"></div>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AED=(n,d=0)=>'AED '+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const money=(n)=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const short=n=>{n=+n||0;if(n>=1e6)return (n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M';if(n>=1e3)return Math.round(n/1e3)+'K';return String(Math.round(n));};

const sum=(arr,f)=>arr.reduce((a,x)=>a+(typeof f==='function'?f(x):f?(+x[f]||0):(+x||0)),0);

const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dISO=off=>{const d=new Date(TODAY);d.setDate(d.getDate()+off);return iso(d);};
const toD=s=>new Date(s+'T00:00:00');
const daysFrom=s=>Math.round((toD(s)-TODAY)/864e5);
const fDate=s=>s?toD(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—';
const fDateS=s=>s?toD(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'—';
const initials=n=>String(n||'?').split(/\s+/).filter(w=>/^[A-Za-z]/.test(w)).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const sameMonth=(s,ref=TODAY)=>{const d=toD(s);return d.getMonth()===ref.getMonth()&&d.getFullYear()===ref.getFullYear();};
const sameQuarter=s=>{const d=toD(s);return d.getFullYear()===TODAY.getFullYear()&&Math.floor(d.getMonth()/3)===Math.floor(TODAY.getMonth()/3);};
function relTime(ts){const m=Math.round((Date.now()-ts)/6e4);if(m<1)return 'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<24)return h+' h ago';const d=Math.round(h/24);return d===1?'yesterday':d+' days ago';}

let SAMPLE=null,DL=null,capsDone=false;

async function saveFile(name,blob){await capsReady;if(DL){try{await DL.save({filename:name,data:blob});toast('Saved '+name);return;}catch(e){if(e&&e.code==='declined'){toast('Download cancelled');return;}if(e&&!['unavailable','not_granted','capability_disabled','capability_removed'].includes(e.code)){toast('Could not save: '+(e.message||e.code),'err');return;}}}
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Downloaded '+name);}
function loadScript(src){return new Promise((res,rej)=>{if($$('script').some(s=>s.src===src))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(s);});}
async function exportPDF(pageEls,filename){
 if(!window.jspdf||!window.html2canvas){toast('PDF tools are still loading. Try again in a moment.','err');return;}
 const scalers=$$('.fitwrap');const prev=scalers.map(s=>s.style.zoom);scalers.forEach(s=>s.style.zoom=1);
 document.body.classList.add('exporting');pageEls.forEach(p=>p.classList.remove('show-guides'));
 const ae=document.activeElement;if(ae&&ae.blur)ae.blur();
 try{const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',compress:true});
  for(let i=0;i<pageEls.length;i++){const cv=await html2canvas(pageEls[i],{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false});if(i)pdf.addPage();pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297);}
  await saveFile(filename,pdf.output('blob'));
 }catch(e){console.error(e);toast('PDF export failed: '+e.message,'err');}
 finally{scalers.forEach((s,i)=>s.style.zoom=prev[i]);document.body.classList.remove('exporting');}
}

function toast(msg,kind){const t=document.createElement('div');t.className='toast'+(kind==='err'?' err':'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),kind==='err'?5200:3000);}
function openModal({title,body,foot,wide,onMount}){const root=$('#modalRoot');root.innerHTML=`<div class="overlay" data-close-ov><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="Close">${icon('x')}</button></div><div class="modal-b">${body}</div>${foot?`<div class="modal-f">${foot}</div>`:''}</div></div>`;const m=$('.modal',root);root.querySelector('[data-close]').onclick=closeModal;root.querySelector('[data-close-ov]').addEventListener('mousedown',e=>{if(e.target.hasAttribute('data-close-ov'))closeModal();});onMount&&onMount(m);const f=m.querySelector('input,select,textarea');f&&f.focus();return m;}
function closeModal(){$('#modalRoot').innerHTML='';}
function closeDrawer(){$('#drawerRoot').innerHTML='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modalRoot').innerHTML)closeModal();else if($('#drawerRoot').innerHTML)closeDrawer();$('#sresults').classList.remove('show');$('#newMenu').classList.remove('show');}});
const formData=root=>{const o={};$$('[name]',root).forEach(el=>{o[el.name]=el.type==='number'?+el.value:el.value.trim();});return o;};
function md(text){const lines=String(text||'').split('\n');let out='',inList=false;const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<em>$2</em>');
 for(const raw of lines){const l=raw.trim();if(/^[-*•]\s+/.test(l)){if(!inList){out+='<ul>';inList=true;}out+='<li>'+inline(l.replace(/^[-*•]\s+/,''))+'</li>';continue;}if(inList){out+='</ul>';inList=false;}if(!l)continue;if(/^#{1,4}\s/.test(l))out+='<h4>'+inline(l.replace(/^#+\s*/,''))+'</h4>';else out+='<p>'+inline(l)+'</p>';}
 if(inList)out+='</ul>';return out;}
function sanitize(html){const doc=new DOMParser().parseFromString('<div>'+html+'</div>','text/html');const ok=new Set(['P','H1','H2','H3','UL','OL','LI','STRONG','B','EM','I','U','BR','TABLE','THEAD','TBODY','TR','TD','TH','HR','DIV','SPAN']);
 const walk=n=>{[...n.children].forEach(c=>{if(!ok.has(c.tagName)){if(['SCRIPT','STYLE','IFRAME','OBJECT'].includes(c.tagName)){c.remove();return;}const frag=document.createDocumentFragment();while(c.firstChild)frag.appendChild(c.firstChild);c.replaceWith(frag);walk(n);return;}[...c.attributes].forEach(a=>c.removeAttribute(a.name));walk(c);});};
 const root=doc.body.firstChild;walk(root);return root.innerHTML;}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied to clipboard');}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied to clipboard');}catch(_){toast('Copy failed','err');}ta.remove();}}
function numWords(n,cur='AED'){const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
 const h=x=>{let s='';if(x>=100){s+=a[Math.floor(x/100)]+' Hundred';x%=100;if(x)s+=' ';}if(x>=20){s+=b[Math.floor(x/10)];if(x%10)s+='-'+a[x%10];}else if(x)s+=a[x];return s;};
 const w=x=>{if(x===0)return 'Zero';let s='';const u=[[1e9,'Billion'],[1e6,'Million'],[1e3,'Thousand']];for(const [v,nm] of u){if(x>=v){s+=h(Math.floor(x/v))+' '+nm+' ';x%=v;}}if(x)s+=h(x);return s.trim();};
 const [big,small]=CUR_WORDS[cur]||CUR_WORDS.AED;const dirham=Math.floor(n),fils=Math.round((n-dirham)*100);return big+' '+w(dirham)+(fils?' and '+w(fils)+' '+small:'')+' only';}

function revenueChart(){const ser=monthSeries();const n=ser.length;const vals=ser.map(x=>x.v);const tgt=teamTarget();
 const W=640,Hh=250,pl=46,pr=10,pt=16,pb=30,max=Math.max(tgt,...vals)*1.12;const bw=(W-pl-pr)/n;const y=v=>pt+(Hh-pt-pb)*(1-v/max);
 let g='';for(let i=0;i<=4;i++){const v=max/4*i;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" /><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--faint)">${short(v)}</text>`;}
 const bars=ser.map(({d,v},i)=>{const w=Math.min(46,bw*0.6),x=pl+i*bw+(bw-w)/2,last=i===n-1;const fill=last?'var(--orange)':v>=tgt?'var(--mag)':'var(--bar)';return `<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(0,y(0)-y(v))}" rx="4" fill="${fill}"><title>${d.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}: ${AED(v)}</title></rect><text x="${x+w/2}" y="${y(v)-6}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${short(v)}</text><text x="${x+w/2}" y="${Hh-10}" text-anchor="middle" font-size="11" fill="${last?'var(--text)':'var(--faint)'}" font-weight="${last?700:400}">${d.toLocaleDateString('en-GB',{month:'short'})}</text>`;}).join('');
 return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Monthly revenue against target">${g}${bars}<line x1="${pl}" x2="${W-pr}" y1="${y(tgt)}" y2="${y(tgt)}" stroke="var(--text)" stroke-dasharray="5 4" stroke-width="1.3"/><rect x="${pl+2}" y="${y(tgt)-19}" width="78" height="16" rx="4" fill="var(--surface)"/><text x="${pl+6}" y="${y(tgt)-7}" font-size="11" font-weight="600" fill="var(--text)">Target ${short(tgt)}</text></svg>`;}
function donut(parts,size=150){const tot=sum(parts,'v')||1;let off=0;const r=52,c=2*Math.PI*r;const segs=parts.map(p=>{const len=p.v/tot*c;const s=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${p.c}" stroke-width="20" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}"><title>${esc(p.l)}: ${AED(p.v)}</title></circle>`;off+=len;return s;}).join('');
 return `<svg width="${size}" height="${size}" viewBox="0 0 140 140" style="transform:rotate(-90deg);flex:none"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="20"/>${segs}</svg>`;}

let salesPeriod='month';
function vSales(v){
 const pred=salesPeriod==='month'?sameMonth:salesPeriod==='quarter'?sameQuarter:(s=>toD(s).getFullYear()===TODAY.getFullYear());
 const mult=salesPeriod==='month'?1:salesPeriod==='quarter'?3:12;
 const won=wonDeals(pred);const wonV=sum(won,'value');
 const lostN=S.deals.filter(d=>d.stage==='lost').length,wonN=S.deals.filter(d=>d.stage==='won').length;
 const winRate=Math.round(wonN/(wonN+lostN)*100);const avgDeal=sum(S.deals.filter(d=>d.stage==='won'),'value')/Math.max(1,wonN);
 const cycle=Math.round(sum(S.deals.filter(d=>d.stage==='won'),d=>(toD(d.close)-toD(d.created))/864e5)/Math.max(1,wonN));

const NUM_FMT={'Tax Invoice':['INV-26_',4],'Proforma Invoice':['PI-26_',4],'Quotation':['Q-26/',5],'Delivery Note':['DO-26_',4],'Purchase Order':['XP26_',4]};

  email:{subject:'Rose & Oud: samples on the way, and a 3-week launch plan',body:`Dear Layla,\n\nThank you for your time on Monday. Rose & Oud sounds like a beautiful range, and we'd love to help it launch on time.\n\nBased on what you shared, here's what we can offer:\n\n- Labels and cartons delivered in the UAE on a committed date\n- Your brand pink approved on a signed proof before production\n- Rose gold foil, soft-touch and tactile varnish, consistent across labels and cartons\n- Arabic and English artwork with batch and expiry printing for Saudi\n\nI'm sending a sample kit to your office this week. Could you share the dielines and SKU list so we can mock up one product and quote properly for you and Rami?\n\nKind regards,\n${me}\n${S.company.name}`},

 if(prods.length<2)prods.push({product:'Self-adhesive PP labels with gloss varnish, 4 to 6 colours',why:'Core label need across their SKUs, printed locally with short lead time',estValueAED:120000},{product:'Variable data printing for batch and expiry',why:'Removes a separate coding step and supports GCC regulations',estValueAED:30000});
 return {snapshot:`${name} is a growing brand in the UAE market. From your notes, they value reliability and presentation and are open to a supplier who makes their life easier.`,special:['Clear growth plans that will need reliable packaging capacity','Brand presentation matters to the decision makers','Room to consolidate several packaging items with one supplier'],painPoints:['Lead times and reliability from their current supplier','Keeping colour and quality consistent between reorders','Managing cost per unit as volumes grow'],opportunities:prods.slice(0,3),pitchAngle:`One partner for all of ${first}'s packaging and print, with approved proofs and dates you can rely on.`,talkingPoints:['One supplier for labels, cartons, pouches and signage','Approved proof before every production run','Fast quotations and samples within days','UAE team with committed delivery dates'],objections:[{objection:'Your price is higher.',response:'Compare landed cost and the cost of delays or reprints. Offer volume-tiered pricing.'},{objection:'We\'re happy with our current supplier.',response:'Suggest a small trial SKU so they can compare quality and speed side by side, with no risk.'},{objection:'We need approvals from head office.',response:'Provide a short spec and compliance pack they can forward internally.'}],stakeholders:[{name:'Main contact',role:'Buyer',approach:'Make their job easier: fast samples, clear specs, dependable delivery.'}],nextSteps:[{step:'Send relevant print samples',when:'This week'},{step:'Collect SKU list, volumes and dielines',when:'Next week'},{step:'Share quotation with a trial option',when:'Within 2 weeks'},{step:'Send printed proofs for approval',when:'Before first order'}],winProbability:55,winReason:'Good fit on local speed and quality, but the relationship is new and pricing is not yet tested.',email:{subject:`${S.company.name} x ${name}: samples and next steps`,body:`Dear [Name],\n\nThank you for your time. Based on our conversation, we believe we can help ${name} with faster lead times, consistent colour and one reliable partner for your packaging.\n\nI'd like to send a few samples of similar work this week. Could you share your SKU list and approximate volumes so we can prepare a quotation?\n\nKind regards,\n${me}\n${S.company.name}`},whatsapp:`Hi, thanks for your time today! I'll send some print samples of similar work this week. Could you share your SKU list and volumes when you get a chance? Happy to share proofs before you commit.`};}

/* ================= settings ================= */
function vSettings(v){const c=S.company;
 v.innerHTML=`<div class="page-h"><div><h1>Settings</h1><p>Company details appear on invoices, quotes and the built-in letterhead.</p></div></div>
 <div class="grid" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start" id="setGrid">
 <div class="card"><div class="card-h"><h3>Company profile</h3></div><div class="card-b" style="display:flex;flex-direction:column;gap:12px" id="coForm">
  <div class="f2"><div class="field"><label>Company name</label><input class="input" name="name" value="${esc(c.name)}"></div><div class="field"><label>TRN (VAT number)</label><input class="input" name="trn" value="${esc(c.trn)}"></div></div>
  <div class="field"><label>Tagline</label><input class="input" name="tagline" value="${esc(c.tagline)}"></div>
  <div class="field"><label>Address</label><input class="input" name="address" value="${esc(c.address)}"></div>
  <div class="f3"><div class="field"><label>Phone</label><input class="input" name="phone" value="${esc(c.phone)}"></div><div class="field"><label>Email</label><input class="input" name="email" value="${esc(c.email)}"></div><div class="field"><label>Website</label><input class="input" name="web" value="${esc(c.web)}"></div></div>
  <div class="f3"><div class="field"><label>Trade licence no.</label><input class="input" name="license" value="${esc(c.license||'')}"></div><div class="field"><label>Licence expiry</label><input class="input" type="date" name="licenseExpiry" value="${esc(c.licenseExpiry||'')}"></div><div class="field"><label>Free zone</label><input class="input" name="freezone" value="${esc(c.freezone||'')}"></div></div>
  <div class="f2"><div class="field"><label>Bank details (printed on invoices)</label><textarea class="input" name="bank" rows="3">${esc(c.bank)}</textarea></div><div class="field"><label>Invoice number prefix</label><input class="input" name="prefix" value="${esc(c.prefix)}"></div></div>
  <div><button class="btn primary" id="coSave">Save company profile</button></div>
 </div></div>
 <div style="display:flex;flex-direction:column;gap:16px">
  <div class="card"><div class="card-h"><h3>Sales team and monthly targets</h3></div><div class="card-b">${S.team.map(m=>`<div class="row" style="flex-wrap:nowrap;margin-bottom:10px">${av(m.id)}<div style="flex:1;min-width:0"><b style="font-size:14px">${esc(m.name)}</b><div class="small muted">${esc(m.role)}</div></div><input class="input num" type="number" step="10000" data-tgt="${m.id}" value="${m.target}" style="width:120px" aria-label="Monthly target for ${esc(m.name)}"></div>`).join('')}
   <div class="field" style="margin-top:6px"><label>Signed in as</label><select class="input" id="meSel">${S.team.map(m=>`<option value="${m.id}" ${m.id===S.me?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div></div></div>
  <div class="card"><div class="card-h"><h3>Company documents</h3></div><div class="card-b">${complianceHTML()}</div></div>
  <div class="card"><div class="card-h"><h3>Appearance</h3></div><div class="card-b"><div class="chips">${[['system','Match device'],['light','Light'],['dark','Dark']].map(([k,l])=>`<button class="chip ${S.prefs.theme===k?'on':''}" data-th="${k}">${l}</button>`).join('')}</div></div></div>
  <div class="card"><div class="card-h"><h3>Demo data</h3></div><div class="card-b"><p class="small muted" style="margin-top:0">Everything is saved in this browser only. Reset to bring back the original sample clients, deals and invoices.</p><button class="btn" id="resetData" style="color:var(--red)">Reset demo data</button></div></div>
 </div></div>`;
 if(innerWidth<900)$('#setGrid').style.gridTemplateColumns='1fr';
 $('#coSave').onclick=()=>{Object.assign(S.company,formData($('#coForm')));save();paintShell();toast('Company profile saved');};
 $$('[data-tgt]',v).forEach(i=>i.onchange=()=>{member(i.dataset.tgt).target=+i.value||0;save();toast('Target updated');});
 $('#meSel').onchange=e=>{S.me=e.target.value;save();paintShell();toast('Signed in as '+member(S.me).name);};
 $$('[data-th]',v).forEach(b=>b.onclick=()=>{S.prefs.theme=b.dataset.th;save();applyTheme();vSettings(v);});
 $('#resetData').onclick=()=>{if(!confirm('Reset all demo data? Your changes and uploaded letterhead will be cleared.'))return;S=seed();save();applyTheme();paintShell();toast('Demo data restored');go('dashboard');};
}

function complianceHTML(){const c=S.company;const le=c.licenseExpiry?daysFrom(c.licenseExpiry):null;
 const m=TODAY.getMonth(),y=TODAY.getFullYear();const pEnd=m===0?new Date(y,1,0):m<=3?new Date(y,4,0):m<=6?new Date(y,7,0):m<=9?new Date(y,10,0):new Date(y+1,1,0);const due=new Date(pEnd.getFullYear(),pEnd.getMonth()+1,28);const pStart=new Date(pEnd.getFullYear(),pEnd.getMonth()-2,1);
 const fm=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
 return `<div class="list-line"><div><b style="font-weight:600">Trade licence</b><br><small class="muted">No. ${esc(c.license)}, ${esc(c.freezone)}</small></div><div style="text-align:right"><span class="pill ${le!==null&&le<60?'p-red':'p-green'}">${le!==null?le+' days left':'Add expiry'}</span><br><small class="muted">Expires ${fDate(c.licenseExpiry)}</small></div></div>
 <div class="list-line"><div><b style="font-weight:600">VAT registration</b><br><small class="muted">TRN ${esc(c.trn)}, effective ${fDate(c.vatSince)}</small></div><span class="pill p-green">Registered</span></div>
 <div class="list-line"><div><b style="font-weight:600">Next VAT return</b><br><small class="muted">Period ${fm(pStart)} to ${fm(pEnd)}</small></div><div style="text-align:right"><span class="pill ${Math.round((due-TODAY)/864e5)<21?'p-red':'p-yel'}">Due ${fm(due)}</span></div></div>`;}

/* ================= boot ================= */
paintShell();route();
</script>
